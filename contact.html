<body class="contact-page">

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid position-relative d-flex align-items-center justify-content-between">

      <a href="index.html" class="logo d-flex align-items-center">

        <ul>
          <li><a href="index.html">Home</a></li>

        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

    </div>
  </header>

  <main class="main">

    <!-- Page Title -->
    <div class="page-title light-background">
      <div class="container">
        <h1>Contact</h1>
        <nav class="breadcrumbs">
          <ol>
            <li><a href="index.html">Home</a></li>
            <li class="current">Contact</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Contact Section -->
    <section id="contact" class="contact section">
      <div class="container position-relative" data-aos="fade-up" data-aos-delay="100">

        <div class="row gy-4">

          <div class="col-lg-5">

            <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="200">
              <i class="bi bi-geo-alt flex-shrink-0"></i>
              <div>
                <h3>Address</h3>
                <p>Syracuse, NY</p>
              </div>
            </div>

            <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="300">
              <i class="bi bi-envelope flex-shrink-0"></i>
              <div>
                <h3>Email</h3>
                <p><a href="mailto:johnnyjvang@gmail.com">johnnyjvang@gmail.com</a></p>
              </div>
            </div>

          </div>

          <div class="col-lg-7">
            <form
              action="https://formspree.io/f/YOUR_FORM_ID"
              method="POST"
              data-aos="fade-up"
              data-aos-delay="500"
            >
              <div class="row gy-4">

                <div class="col-md-6">
                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Your Name"
                    required
                  >
                </div>

                <div class="col-md-6">
                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Your Email"
                    required
                  >
                </div>

                <div class="col-md-12">
                  <input
                    type="text"
                    name="subject"
                    class="form-control"
                    placeholder="Subject"
                    required
                  >
                </div>

                <div class="col-md-12">
                  <textarea
                    class="form-control"
                    name="message"
                    rows="6"
                    placeholder="Message"
                    required
                  ></textarea>
                </div>

                <!-- Optional extras for Formspree -->
                <input type="hidden" name="_subject" value="New portfolio contact form submission">
                <input type="hidden" name="_next" value="https://johnnyjvang.github.io/thank-you.html">

                <div class="col-md-12 text-center">
                  <button type="submit">Send Message</button>
                </div>

              </div>
            </form>
          </div>

        </div>

      </div>
    </section>

  </main>

        </a>
        <a href="https://www.linkedin.com/in/jjvang/" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-linkedin"></i>
        </a>
      </div>
    </div>
  </footer>
